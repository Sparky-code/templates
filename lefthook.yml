pre-commit:
  jobs:
    - name: ruff format
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    - name: ruff check
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}

pre-push:
  jobs:
    - name: fast tests
      run: uv run pytest

commit-msg:
  jobs:
    - name: commit message
      run: bash baseline/.lefthook/commit-msg/check-message.sh {1}
